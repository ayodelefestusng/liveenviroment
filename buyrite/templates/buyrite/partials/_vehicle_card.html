<div class="bg-white rounded-lg shadow-md overflow-hidden">
<img src="{{ vehicle.image.url }}" alt="{{ vehicle.brand }} {{ vehicle.vehicle_model }} photo" class="w-full h-48 object-cover">
<div class="p-4">
<h3 class="text-lg font-semibold text-gray-800">{{ vehicle.manufacture_year }} {{ vehicle.brand }} {{ vehicle.vehicle_model }}</h3>
<p class="text-xl font-bold text-gray-900 mt-1">₦{{ vehicle.price|intcomma }}</p>
<div class="text-sm text-gray-500 mt-2 space-y-1">
<p><i class="fas fa-tachometer-alt"></i> {{ vehicle.mileage|intcomma }} km</p>
<p><i class="fas fa-gas-pump"></i> {{ vehicle.get_fuel_option_display }}</p>
<p><i class="fas fa-cogs"></i> {{ vehicle.get_transmission_display }}</p>
<p><i class="fas fa-map-marker-alt"></i> {{ vehicle.town }}, {{ vehicle.state }}</p>
</div>
<a href="{% url 'vehicle_detail' vehicle.id %}" class="mt-4 inline-block w-full bg-blue-600 text-white text-center py-2 rounded-lg font-medium hover:bg-blue-700 transition-colors duration-200">
View Details
</a>
</div>
</div>
