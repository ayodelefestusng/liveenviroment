{% extends 'base.html' %}
{% load static %}
{% load humanize %}

{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
    
    body {
        font-family: 'Poppins', sans-serif;
        background-color: #f0f4f8; /* A very light blue-gray background */
    }

    .card {
        @apply bg-white rounded-2xl shadow-xl p-8;
        transition: transform 0.3s ease-in-out;
    }
    .card:hover {
        transform: translateY(-5px);
    }
    
    .btn {
        @apply font-semibold py-3 px-6 rounded-xl transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2;
    }

    .btn-primary {
        @apply text-white bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 focus:ring-blue-500;
    }
</style>

<div class="min-h-screen flex items-center justify-center p-6">
    <div class="container mx-auto max-w-lg">
        <div class="card">
            <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Admin Tool: {{ model_name }}</h1>

            {% if message %}
                <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg relative mb-6" role="alert">
                    <span class="block sm:inline">{{ message }}</span>
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="flex items-center justify-between mt-8">
                    <button type="submit" class="btn btn-primary">
                        Save
                    </button>
                    <a href="{% url 'buyrite:operations' %}" class="text-sm font-medium text-gray-600 hover:underline">
                        Back to Dashboard
                    </a>
                    <a href="{% url 'buyrite:handle_admin_tool_form' model_name=model_name %}" class="btn btn-primary">
                        Add New {{ model_name }}
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
