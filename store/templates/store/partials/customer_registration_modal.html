<div class="modal-header">
    <h5 class="modal-title" id="customerRegistrationModalLabel">Customer Information</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body">
    <form hx-post="{% url 'store:create-customer' %}" 
          hx-target="#customerRegistrationModal .modal-body" 
          hx-swap="innerHTML">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary">Save Customer</button>
        </div>
    </form>
</div>
