<div class="card shadow-sm rounded-3 overflow-hidden mb-4">
    <div class="card-body">
        <h5 class="card-title fw-bold">Customer Found</h5>
        <p class="card-text">
            We found an existing customer with this number. Please confirm the details below.
        </p>
        <ul class="list-group list-group-flush">
            <li class="list-group-item">
                <span class="fw-bold">Name:</span> {{ customer.name }}
            </li>
            <li class="list-group-item">
                <span class="fw-bold">Email:</span> {{ customer.email }}
            </li>
            <li class="list-group-item">
                <span class="fw-bold">Phone:</span> {{ customer.phone_number }}
            </li>
        </ul>
        <!-- Hidden input to pass the customer ID to the next form -->
        <input type="hidden" name="customer_id" value="{{ customer.id }}">
    </div>
</div>
