<form method="get">
    <input type="text" name="q" placeholder="Search title or content" value="{{ query }}">
    <select name="category">
        <option value="">All Categories</option>
        {% for cat in categories %}
            <option value="{{ cat.id }}" {% if cat.id|stringformat:"s" == selected_category %}selected{% endif %}>{{ cat.name }}</option>
        {% endfor %}
    </select>
    <input type="text" name="tag" placeholder="Tag" value="{{ selected_tag }}">
    <button type="submit">Search</button>
</form>

<ul>
    {% for article in articles %}
        <li><strong>{{ article.title }}</strong> — {{ article.category.name }} — Tags: {{ article.tags.all|join:", " }}</li>
    {% empty %}
        <li>No articles found.</li>
    {% endfor %}
</ul>
