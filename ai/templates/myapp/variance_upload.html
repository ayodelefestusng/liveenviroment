

{% extends "base1.html" %}
{% load static  %}

{% block title %}
  <title>Payroll Variance Upload</title>
{% endblock title %}




{% block content %}
  <div class="d-flex justify-content-center my-5">
    <div class="w-50 p-4 border rounded shadow">
      <h2 class="text-center">Upload Payroll Files</h2>
      <form action="{% url 'ai:variance' %}?format=html" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="mb-3">
          <label for="old" class="form-label">Old Payroll File (.json)</label>
          <input type="file" name="old" id="old" accept=".json" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="new" class="form-label">New Payroll File (.json)</label>
          <input type="file" name="new" id="new" accept=".json" class="form-control" required>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-success btn-sm mt-2" style="background-color: #00B140;">
            Compare Variance
          </button>
        </div>
      </form>
      <p class="mt-3 text-muted text-center">Ensure both files are in valid JSON format.</p>
    </div>
  </div>
{% endblock content %}
