<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dignity Concept - Engineering Africa's Intelligent Future{% endblock %}</title>
    
    <!-- SEO Meta Tags -->
    {% block meta_tags %}
    <meta name="description" content="{% block meta_description %}Dignity Concept Limited unifies data, analytics, and AI to help African enterprises scale with confidence and lead their industries.{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}AI, Machine Learning, Data Analytics, Software Engineering, Africa Technology{% endblock %}">
    {% endblock %}
    
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    {% load static %}
    <link href="{% static 'css/main.css' %}" rel="stylesheet">
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
</head>
<body class="d-flex flex-column h-100">
    <!-- Navigation -->
    {% include 'partials/header.html' %}
    
    <!-- Main Content -->
    <main class="flex-shrink-0">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    {% include 'partials/footer.html' %}
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
    
    <!-- Live Chat -->
    <script>
        // Tawk.to or Intercom integration
    </script>
</body>
</html>
